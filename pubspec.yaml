name: recovery_fit
description: "AI-powered injury-safe workout planner."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^13.2.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Networking
  http: ^1.6.0

  # UI helpers
  fl_chart: ^0.67.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.1
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^17.2.4

  # In-app purchase
  in_app_purchase: ^3.2.3

  # Utilities
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
    - assets/images/
    - assets/fonts/
