name: recoveryfit
description: Injury-aware personalized workout planner powered by LLM.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Networking
  http: ^1.2.0

  # Charts
  fl_chart: ^0.67.0

  # Notifications
  flutter_local_notifications: ^17.1.0

  # In-app purchase
  in_app_purchase: ^3.1.13

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/exercises/exercises.json
    - assets/images/


